# ── 上游：与后端保持长连接 ──
# 不配 upstream keepalive 时，nginx 每个请求都要新建到 api:8001 的 TCP 连接。
# 容器内网 RTT 很低，但并发上来后 TIME_WAIT 和握手会变成可观测的开销。
upstream api_backend {
    server api:8001;
    keepalive 32;              # 保持 32 条空闲长连接
    keepalive_requests 1000;   # 单连接复用多少次后重建
    keepalive_timeout 60s;
}

# ── 限流：按真实客户端 IP，20 次/分钟 ──
# 放 nginx 而不是只放应用层的理由：应用层计数器是进程内的，多 worker / 多实例后
# 每个进程各算各的，等于没限；nginx 的漏桶在 worker 间共享，是真正的全局限制。
# 阈值与应用层（20/min 滑动窗口）保持一致：nginx 负责削峰，应用层作为兜底。
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/m;
limit_req_status 429;          # 与应用层返回码一致，前端不用区分两种限流来源

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 事件 JSON 只有几百字节，默认 1m 其实够用。显式写出来是因为默认值太容易被忽略——
    # 以后支持日志上传时，413 会报得莫名其妙。
    client_max_body_size 2m;

    # 后端接口反代：/api/classify → http://api:8001/classify
    # 这样前端代码里只需要认 /api 前缀，dev/prod 完全一致
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;

        # upstream keepalive 的前提：清掉默认的 Connection: close，
        # 否则长连接池形同虚设（nginx 仍会每个请求新建连接）
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 限流：burst=5 允许短时突发（页面连点不会立刻 429），nodelay 让突发立即放行、
        # 不排队等待；超出 burst 才返回 429
        limit_req zone=api_rl burst=5 nodelay;
        # nginx 默认的 429 响应体是 HTML，前端 res.json() 解析失败只能显示 "HTTP 429"。
        # 这里改成和 FastAPI 一致的 {"detail": "..."}，让两种限流来源对前端完全同构。
        error_page 429 = @rate_limited;

        # 超时与后端请求预算（settings.request_budget_ms=12s）对齐，留 8s 余量：
        # 后端承诺单请求 12s 内返回（预算耗尽走降级），nginx 20s 才 504。
        # 旧值 120s 的问题：允许慢请求挂 2 分钟，长期占满连接池还掩盖后端超时问题。
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;

        # ── 接 SSE / 流式输出时必须同时打开下面两行 ──
        # proxy_buffering off;
        # add_header X-Accel-Buffering no;
        # 原因：默认 proxy_buffering on 会把后端分块吐出的 token 攒成大块再发，
        # 前端看到的就不是逐字输出。两行都要，X-Accel-Buffering 是双保险。
        #
        # 另一个容易误解的点：proxy_read_timeout 的语义是「两次读操作之间的空闲」，
        # 不是「整个响应的总时长」。流式下 token 不断到达会持续重置计时器，
        # 20s 不会切断长回答；反过来首 token 超过 20s 就会断。
        # 总时长的硬上界只能由应用层 Budget 保证，nginx 没有「总时长」这个指令。
    }

    # 限流命中时的响应：结构与 app/main.py 里的 HTTPException 保持一致
    location @rate_limited {
        default_type application/json;
        # always 必须加：add_header 默认只对 2xx/3xx 生效，429 不会带上这个头
        add_header Retry-After 3 always;
        return 429 '{"detail":"请求过于频繁，请稍后再试"}';
    }

    # SPA 路由回退：/assistant 这类前端路由直接刷新也能命中 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，内容变了 hash 也变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
