server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 后端接口反代：/api/classify → http://api:8001/classify
    # 这样前端代码里只需要认 /api 前缀，dev/prod 完全一致
    location /api/ {
        proxy_pass http://api:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时与后端请求预算（settings.request_budget_ms=12s）对齐，留 8s 余量：
        # 后端承诺单请求 12s 内返回（预算耗尽走降级），nginx 20s 才 504。
        # 旧值 120s 的问题：允许慢请求挂 2 分钟，长期占满连接池还掩盖后端超时问题。
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }

    # SPA 路由回退：/assistant 这类前端路由直接刷新也能命中 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，内容变了 hash 也变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
