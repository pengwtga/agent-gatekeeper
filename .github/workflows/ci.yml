# CI（T6-3）：lint + 单测，单版本矩阵（项目锁定 3.12，无多版本需求）
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint（ruff）
        run: ruff check app/ tests/ scripts/

      - name: 单测（pytest）
        run: pytest -q
